<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selfie-Fotokasten v7.2</title>
<style>
  :root{
    --bg0:#0b0c10; --bg1:#12162a;
    --card: rgba(18,22,42,.72);
    --fg:#e9edf1; --muted:#b9c0cc;
    --btn:#1c2033; --btn2:#262b45;
    --shadow: 0 30px 90px rgba(0,0,0,.55);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
    color:var(--fg);
    background: radial-gradient(1100px 700px at 50% -10%, var(--bg1), var(--bg0));
  }
  .app{
    width:min(95vw, 640px);
    background: var(--card);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 22px;
    padding: 14px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  .top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .title{ font-weight:850; letter-spacing:.2px; }
  .sub{ font-size:12px; color:var(--muted); }

  .stage{
    position:relative; border-radius:16px; overflow:hidden; background:#000;
    border:1px solid rgba(255,255,255,.08);
  }
  video{
    width:100%; aspect-ratio:3/4; object-fit:cover; display:block;
    transform: scaleX(-1);
  }
  .overlay{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
  .count{
    font-size:92px; font-weight:900;
    color:#ffd166;
    text-shadow: 0 12px 34px rgba(0,0,0,.85);
  }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; transition: opacity .12s ease; }
  .flash.on{ opacity:.85; }

  .controls{ display:grid; gap:10px; margin-top:10px; }
  .row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .row3{ grid-template-columns: 1.2fr 1fr 1fr; }

  button, select, input[type="text"]{
    width:100%; padding:12px 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.10);
    background: var(--btn);
    color: var(--fg);
    font-weight: 650;
    outline: none;
  }
  button.primary{
    background:#ffd166;
    color:#1b1400;
    border-color: transparent;
  }
  button:active{ transform: translateY(1px); }

  .pill{
    display:flex; align-items:center; gap:10px;
    background: var(--btn2);
    border:1px solid rgba(255,255,255,.08);
    padding: 10px 12px; border-radius:14px;
  }
  .pill label{ font-size:12px; color:var(--muted); min-width:88px; }
  .pill input[type="range"]{ width:100%; }

  .small{
    font-size:12px; color:var(--muted);
    display:flex; justify-content:space-between; gap:8px; padding:0 2px;
  }

  .out{ margin-top:12px; display:grid; gap:10px; }
  .preview{
    width:100%; border-radius: 16px; background:#fff;
    border:1px solid rgba(255,255,255,.10);
  }
  canvas{ display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="title">Selfie-Fotokasten v7.2</div>
      <div class="sub">Strip • Grid • Polaroid • Shapes • Theme optional • Flipbook</div>
    </div>
    <button id="flip" title="Kamera wechseln">🔁</button>
  </div>

  <div class="stage">
    <video id="video" playsinline autoplay muted></video>
    <div class="overlay"><div id="count" class="count"></div></div>
    <div id="flash" class="flash"></div>
  </div>

  <div class="controls">
    <div class="row">
      <button id="start" class="primary">📸 Start</button>
      <button id="redo">♻️ Neu</button>
    </div>

    <div class="row row3">
      <select id="layout">
        <option value="strip">Layout: Strip</option>
        <option value="grid">Layout: Grid</option>
        <option value="polaroid">Layout: Polaroid</option>
      </select>

      <select id="theme">
        <option value="off">Theme: aus</option>
        <option value="hearts">Theme: ❤️ Hearts</option>
        <option value="autumn">Theme: 🍂 Autumn</option>
        <option value="spring">Theme: 🌱 Spring</option>
        <option value="summer">Theme: ☀️ Summer</option>
        <option value="winter">Theme: ❄️ Winter</option>
        <option value="sketch">Theme: ✍️ Sketch</option>
      </select>

      <select id="bg">
        <option value="paper">BG: Paper</option>
        <option value="solid">BG: Solid</option>
        <option value="gradient">BG: Gradient</option>
        <option value="pattern">BG: Pattern</option>
      </select>
    </div>

    <div class="row row3">
      <select id="filter">
        <option value="none">Filter: Normal</option>
        <option value="bw">Filter: B&W</option>
        <option value="vintage">Filter: Vintage</option>
        <option value="warm">Filter: Warm</option>
        <option value="contrast">Filter: Contrast</option>
      </select>

      <select id="shape">
        <option value="rounded">Shape: Rounded</option>
        <option value="rect">Shape: Rect</option>
        <option value="circle">Shape: Circle</option>
        <option value="heart">Shape: Heart</option>
        <option value="triangle">Shape: Triangle</option>
        <option value="hex">Shape: Hex</option>
        <option value="ticket">Shape: Ticket</option>
        <option value="mix">Shape: Mix</option>
      </select>

      <button id="mirror">🪞 Mirror: an</button>
    </div>

    <div class="row">
      <div class="pill">
        <label>Fotos</label>
        <input id="shots" type="range" min="2" max="12" value="4" />
        <span id="shotsVal" style="font-size:12px;color:var(--muted);min-width:26px;text-align:right;">4</span>
      </div>
      <div class="pill">
        <label>Countdown</label>
        <input id="timer" type="range" min="0" max="8" value="3" />
        <span id="timerVal" style="font-size:12px;color:var(--muted);min-width:26px;text-align:right;">3</span>
      </div>
    </div>

    <div class="row">
      <div class="pill">
        <label>BG Stärke</label>
        <input id="bgInt" type="range" min="0" max="100" value="70" />
        <span id="bgIntVal" style="font-size:12px;color:var(--muted);min-width:32px;text-align:right;">70</span>
      </div>
      <div class="pill">
        <label>Theme Stärke</label>
        <input id="thInt" type="range" min="0" max="100" value="75" />
        <span id="thIntVal" style="font-size:12px;color:var(--muted);min-width:32px;text-align:right;">75</span>
      </div>
    </div>

    <div class="row">
      <div class="pill">
        <label>Rand/Gap</label>
        <input id="gap" type="range" min="6" max="32" value="16" />
        <span id="gapVal" style="font-size:12px;color:var(--muted);min-width:32px;text-align:right;">16</span>
      </div>
      <div class="pill">
        <label>FPS</label>
        <input id="fps" type="range" min="2" max="12" value="6" />
        <span id="fpsVal" style="font-size:12px;color:var(--muted);min-width:32px;text-align:right;">6</span>
      </div>
    </div>

    <div class="row">
      <input id="caption" type="text" placeholder="Optionaler Text" />
      <button id="dateToggle">📅 Datum: an</button>
    </div>

    <div class="row">
      <button id="download">⬇️ Download JPG</button>
      <button id="flipbook">🎞️ Flipbook</button>
    </div>

    <div class="small">
      <span id="status">Bereit.</span>
      <span></span>
    </div>
  </div>

  <div class="out">
    <img id="preview" class="preview" alt="" />
  </div>
</div>

<canvas id="c"></canvas>

<script>
(() => {
  const video = document.getElementById('video');
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  const countEl = document.getElementById('count');
  const flashEl = document.getElementById('flash');
  const preview = document.getElementById('preview');
  const statusEl = document.getElementById('status');

  const layoutSel = document.getElementById('layout');
  const themeSel  = document.getElementById('theme');
  const bgSel     = document.getElementById('bg');
  const filterSel = document.getElementById('filter');
  const shapeSel  = document.getElementById('shape');

  const shotsRange = document.getElementById('shots');
  const shotsVal   = document.getElementById('shotsVal');
  const timerRange = document.getElementById('timer');
  const timerVal   = document.getElementById('timerVal');

  const bgInt      = document.getElementById('bgInt');
  const bgIntVal   = document.getElementById('bgIntVal');
  const thInt      = document.getElementById('thInt');
  const thIntVal   = document.getElementById('thIntVal');

  const gapRange   = document.getElementById('gap');
  const gapVal     = document.getElementById('gapVal');

  const fpsRange   = document.getElementById('fps');
  const fpsVal     = document.getElementById('fpsVal');

  const captionEl  = document.getElementById('caption');
  const btnDate    = document.getElementById('dateToggle');

  const btnStart   = document.getElementById('start');
  const btnRedo    = document.getElementById('redo');
  const btnFlip    = document.getElementById('flip');
  const btnDownload= document.getElementById('download');
  const btnFlipbook= document.getElementById('flipbook');
  const btnMirror  = document.getElementById('mirror');

  let facing='user', stream=null, lastOut='';
  let lastFrames = [];
  let mirrorOn=true, dateOn=true;

  function setStatus(t){ statusEl.textContent=t; }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  shotsRange.oninput=()=>shotsVal.textContent=shotsRange.value;
  timerRange.oninput=()=>timerVal.textContent=timerRange.value;
  bgInt.oninput=()=>bgIntVal.textContent=bgInt.value;
  thInt.oninput=()=>thIntVal.textContent=thInt.value;
  gapRange.oninput=()=>gapVal.textContent=gapRange.value;
  fpsRange.oninput=()=>fpsVal.textContent=fpsRange.value;

  function syncThemeUI(){
    const off = (themeSel.value === 'off');
    thInt.disabled = off;
    thInt.parentElement.style.opacity = off ? '0.55' : '1';
  }
  themeSel.addEventListener('change', syncThemeUI);
  syncThemeUI();

  btnDate.onclick=()=>{
    dateOn=!dateOn;
    btnDate.textContent = dateOn ? '📅 Datum: an' : '📅 Datum: aus';
  };

  function updateMirror(){
    const shouldMirror = mirrorOn && facing==='user';
    video.style.transform = shouldMirror ? 'scaleX(-1)' : 'none';
  }

  async function startCam(){
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:facing}, audio:false });
    video.srcObject=stream;
    updateMirror();
  }

  btnFlip.onclick=async()=>{
    facing = (facing==='user') ? 'environment' : 'user';
    setStatus('Kamera wechseln…');
    await startCam();
    setStatus('Bereit.');
  };

  btnMirror.onclick=()=>{
    mirrorOn=!mirrorOn;
    btnMirror.textContent = mirrorOn ? '🪞 Mirror: an' : '🪞 Mirror: aus';
    updateMirror();
  };

  btnRedo.onclick=()=>{
    lastOut=''; lastFrames=[];
    preview.removeAttribute('src');
    setStatus('Bereit.');
  };

  btnDownload.onclick=()=>{
    if(!lastOut){ setStatus('Kein Ergebnis.'); return; }
    const a=document.createElement('a');
    a.href=lastOut;
    a.download=`fotokasten_${layoutSel.value}_${themeSel.value}_${shapeSel.value}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus('Download gestartet.');
  };

  function flash(){
    flashEl.classList.add('on');
    setTimeout(()=>flashEl.classList.remove('on'),120);
  }

  async function countdown(sec){
    for(let i=sec;i>0;i--){
      countEl.textContent=i;
      await sleep(700);
    }
    countEl.textContent='';
  }

  function applyFilter(){
    switch(filterSel.value){
      case 'bw': ctx.filter='grayscale(100%) contrast(1.08)'; break;
      case 'vintage': ctx.filter='sepia(0.55) contrast(1.10) saturate(1.15)'; break;
      case 'warm': ctx.filter='sepia(0.25) saturate(1.35) contrast(1.05)'; break;
      case 'contrast': ctx.filter='contrast(1.25) saturate(1.1)'; break;
      default: ctx.filter='none';
    }
  }

  function captureFrame(){
    const vw=video.videoWidth, vh=video.videoHeight;
    if(!vw||!vh) throw new Error('Video nicht bereit');

    const targetAR=3/4;
    const srcAR=vw/vh;

    let sx=0, sy=0, sw=vw, sh=vh;
    if(srcAR>targetAR){
      sh=vh; sw=Math.round(vh*targetAR); sx=Math.round((vw-sw)/2);
    }else{
      sw=vw; sh=Math.round(vw/targetAR); sy=Math.round((vh-sh)/2);
    }

    const outW=900, outH=Math.round(outW/targetAR);
    c.width=outW; c.height=outH;

    ctx.save();
    const shouldMirror = mirrorOn && facing==='user';
    if(shouldMirror){ ctx.translate(outW,0); ctx.scale(-1,1); }
    applyFilter();
    ctx.drawImage(video, sx, sy, sw, sh, 0,0,outW,outH);
    ctx.restore();
    ctx.filter='none';

    return c.toDataURL('image/jpeg',0.95);
  }

  // ===== render helpers =====
  function roundedRect(x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function hexToRgba(hex, a){
    const h = (hex||'').replace('#','').trim();
    if(h.length!==6) return `rgba(255,209,102,${a})`;
    const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function themePalette(){
    const t=themeSel.value;
    if(t==='hearts') return { base:'#fff3f8', ink:'#2a1020', a:'#ff4f8b', b:'#ffd1e3' };
    if(t==='autumn') return { base:'#fff3e4', ink:'#2a1b10', a:'#d36b1e', b:'#f1b36a' };
    if(t==='spring') return { base:'#f2fff3', ink:'#102a18', a:'#22c36a', b:'#bff2cc' };
    if(t==='summer') return { base:'#fffdf0', ink:'#1a1f2a', a:'#ffd166', b:'#63d9ff' };
    if(t==='winter') return { base:'#f1f7ff', ink:'#0e2333', a:'#6ac9ff', b:'#c7e7ff' };
    return { base:'#f7f6f3', ink:'#101010', a:'#444444', b:'#dddddd' };
  }

  function drawBackground(w,h){
    const { base, a, b } = themePalette();
    const intensity=parseInt(bgInt.value,10)/100;
    const mode=bgSel.value;

    ctx.fillStyle=base;
    ctx.fillRect(0,0,w,h);

    if(mode==='solid') return;

    if(mode==='paper'){
      const g=ctx.createLinearGradient(0,0,w,h);
      g.addColorStop(0,'rgba(255,255,255,.70)');
      g.addColorStop(1,'rgba(0,0,0,.05)');
      ctx.globalAlpha=0.35+0.55*intensity;
      ctx.fillStyle=g;
      ctx.fillRect(0,0,w,h);
      ctx.globalAlpha=1;
      return;
    }

    if(mode==='gradient'){
      const g=ctx.createRadialGradient(w*0.35,h*0.25,50, w*0.5,h*0.5, Math.max(w,h));
      g.addColorStop(0, hexToRgba(a, 0.22*intensity));
      g.addColorStop(1, hexToRgba(b, 0.16*intensity));
      ctx.fillStyle=g;
      ctx.fillRect(0,0,w,h);
      return;
    }

    ctx.save();
    ctx.globalAlpha=0.12+0.30*intensity;
    ctx.strokeStyle='rgba(0,0,0,.40)';
    ctx.lineWidth=1;
    const step=34;
    for(let x=-h;x<w;x+=step){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+h,h); ctx.stroke();
    }
    ctx.restore();
  }

  function drawOuterBorder(w,h){
    const { ink, a } = themePalette();
    const s = (themeSel.value === 'off') ? 0 : parseInt(thInt.value,10)/100;

    ctx.save();
    ctx.lineWidth=7;
    ctx.strokeStyle=hexToRgba(ink, 0.22 + 0.20*s);
    roundedRect(10,10,w-20,h-20,28);
    ctx.stroke();

    if(s > 0){
      ctx.lineWidth=4;
      ctx.strokeStyle=hexToRgba(a, 0.30 + 0.35*s);
      roundedRect(24,24,w-48,h-48,26);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCaption(w,h){
    const cap=(captionEl.value||'').trim();
    const parts=[];
    if(cap) parts.push(cap);
    if(dateOn) parts.push(new Date().toLocaleDateString('de-DE'));
    if(!parts.length) return;

    const { ink } = themePalette();
    ctx.save();
    ctx.fillStyle=hexToRgba(ink,0.88);
    ctx.font='900 36px system-ui, -apple-system, Segoe UI, Roboto, Arial';
    ctx.textAlign='center';
    ctx.fillText(parts.join(' • '), w/2, h-30);
    ctx.restore();
  }

  function jitterLine(x1,y1,x2,y2, jitter=3.0, segments=18){
    ctx.beginPath();
    for(let i=0;i<=segments;i++){
      const t=i/segments;
      const x=x1+(x2-x1)*t + (Math.random()-0.5)*jitter;
      const y=y1+(y2-y1)*t + (Math.random()-0.5)*jitter;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  function rand(min,max){ return min + Math.random()*(max-min); }

  // ===== Theme overlay =====
  function themeOverlay(w,h){
    if(themeSel.value === 'off') return;

    const { ink, a, b } = themePalette();
    const s=parseInt(thInt.value,10)/100;

    ctx.save();
    ctx.globalAlpha = 0.35 + 0.45*s;
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = hexToRgba(a, 0.10 + 0.25*s);
    ctx.fillRect(0,0,w,h);

    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = hexToRgba(b, 0.08 + 0.22*s);
    ctx.fillRect(0,0,w,h);

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.55 + 0.35*s;

    if(themeSel.value==='hearts') overlayHearts(w,h, a, b, ink, s);
    else if(themeSel.value==='autumn') overlayAutumn(w,h, a, b, ink, s);
    else if(themeSel.value==='spring') overlaySpring(w,h, a, b, ink, s);
    else if(themeSel.value==='summer') overlaySummer(w,h, a, b, ink, s);
    else if(themeSel.value==='winter') overlayWinter(w,h, a, b, ink, s);
    else overlaySketch(w,h, a, b, ink, s);

    ctx.restore();
  }

  function drawHeartPath(cx,cy,size){
    const s=size;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s*0.30);
    ctx.bezierCurveTo(cx - s*0.55, cy - s*0.10, cx - s*0.55, cy + s*0.65, cx, cy + s*0.95);
    ctx.bezierCurveTo(cx + s*0.55, cy + s*0.65, cx + s*0.55, cy - s*0.10, cx, cy + s*0.30);
    ctx.closePath();
  }

  function overlayHearts(w,h,a,b,ink,s){
    for(let i=0;i<12;i++){
      const x = (i%3===0)? w*0.18 : (i%3===1? w*0.52 : w*0.82);
      const y = 90 + i*120;
      const size = 70 + (i%4)*18 + 40*s;
      ctx.fillStyle = hexToRgba(i%2===0?a:b, 0.55);
      drawHeartPath(x + rand(-30,30), y + rand(-20,20), size);
      ctx.fill();
    }
    ctx.strokeStyle = hexToRgba(ink, 0.35);
    ctx.lineWidth = 4;
    jitterLine(40, 90, w-60, 70, 3.6, 18);
    jitterLine(60, h-140, w-80, h-170, 3.6, 18);
  }

  function drawLeaf(cx,cy,size,rot){
    const s=size;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0, -s*0.55);
    ctx.bezierCurveTo(s*0.55, -s*0.35, s*0.55, s*0.25, 0, s*0.60);
    ctx.bezierCurveTo(-s*0.55, s*0.25, -s*0.55, -s*0.35, 0, -s*0.55);
    ctx.closePath();
    ctx.restore();
  }
  function overlayAutumn(w,h,a,b,ink,s){
    for(let i=0;i<10;i++){
      const x = 60 + i*(w-120)/9;
      const y = 120 + Math.sin(i*0.7)*80 + i*70;
      const size = 70 + 30*s;
      ctx.fillStyle = hexToRgba(i%2?a:b, 0.55);
      drawLeaf(x, y, size, -0.35 + i*0.08);
      ctx.fill();
    }
    ctx.strokeStyle = hexToRgba(ink, 0.28);
    ctx.lineWidth = 5;
    jitterLine(30, 160, w*0.65, 60, 4.2, 16);
    jitterLine(w-30, 210, w*0.45, 70, 4.2, 16);
  }

  function drawFlower(cx,cy,size){
    const s=size;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3;
      const x=cx+Math.cos(a)*s;
      const y=cy+Math.sin(a)*s;
      ctx.moveTo(x,y);
      ctx.arc(x,y,s*0.60,0,Math.PI*2);
    }
    ctx.closePath();
  }
  function overlaySpring(w,h,a,b,ink,s){
    for(let i=0;i<18;i++){
      const x = 80 + (i%6)*(w-160)/5;
      const y = 110 + Math.floor(i/6)*220 + rand(-30,30);
      const size = 28 + 12*s;
      ctx.fillStyle = hexToRgba(i%2?a:b, 0.60);
      drawFlower(x, y, size);
      ctx.fill();
    }
    ctx.strokeStyle = hexToRgba(ink, 0.22);
    ctx.lineWidth = 5;
    for(let i=0;i<4;i++){
      jitterLine(40, 120+i*180, w-60, 60+i*160, 4.0, 18);
    }
  }

  function overlaySummer(w,h,a,b,ink,s){
    ctx.fillStyle = hexToRgba(a, 0.55);
    ctx.beginPath(); ctx.arc(w-120, 120, 90+50*s, 0, Math.PI*2); ctx.fill();

    ctx.strokeStyle = hexToRgba(ink, 0.28);
    ctx.lineWidth = 5;
    for(let i=0;i<12;i++){
      const ang=i*Math.PI/6;
      jitterLine(
        w-120+Math.cos(ang)*(120+40*s),
        120+Math.sin(ang)*(120+40*s),
        w-120+Math.cos(ang)*(150+55*s),
        120+Math.sin(ang)*(150+55*s),
        3.0, 8
      );
    }

    ctx.strokeStyle = hexToRgba(b, 0.55);
    ctx.lineWidth = 6;
    for(let r=0;r<6;r++){
      const yy = 190 + r*55;
      ctx.beginPath();
      for(let x=30;x<w-30;x+=16){
        const y = yy + Math.sin(x*0.03 + r)*10;
        if(x===30) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }

  function drawSnowflake(cx,cy,s){
    for(let k=0;k<6;k++){
      const a=k*Math.PI/3;
      jitterLine(cx,cy, cx+Math.cos(a)*s*3.0, cy+Math.sin(a)*s*3.0, 2.0, 6);
      const bx=cx+Math.cos(a)*s*1.8, by=cy+Math.sin(a)*s*1.8;
      jitterLine(bx,by, bx+Math.cos(a+0.7)*s*1.2, by+Math.sin(a+0.7)*s*1.2, 1.6, 4);
      jitterLine(bx,by, bx+Math.cos(a-0.7)*s*1.2, by+Math.sin(a-0.7)*s*1.2, 1.6, 4);
    }
  }
  function overlayWinter(w,h,a,b,ink,s){
    ctx.strokeStyle = hexToRgba(a, 0.70);
    ctx.lineWidth = 5;
    for(let i=0;i<9;i++){
      const x = 90 + (i%3)*(w-180)/2 + rand(-20,20);
      const y = 120 + Math.floor(i/3)*260 + rand(-20,20);
      drawSnowflake(x,y, 26+18*s);
    }
    ctx.strokeStyle = hexToRgba(ink, 0.22);
    ctx.lineWidth = 5;
    jitterLine(40, 110, w-60, 80, 4.0, 18);
    jitterLine(60, h-160, w-80, h-190, 4.0, 18);
  }

  function overlaySketch(w,h,a,b,ink,s){
    ctx.strokeStyle = hexToRgba(ink, 0.40);
    ctx.lineWidth = 6;
    for(let i=0;i<3;i++){
      jitterLine(30, 70+i*12, w-30, 55+i*10, 5.0, 20);
      jitterLine(40, h-160-i*10, w-40, h-180-i*12, 5.0, 20);
      jitterLine(40+i*12, 70, 20+i*10, h-170, 5.0, 20);
      jitterLine(w-40-i*12, 70, w-20-i*10, h-170, 5.0, 20);
    }
    ctx.strokeStyle = hexToRgba(a, 0.60);
    ctx.lineWidth = 5;
    for(let i=0;i<10;i++){
      ctx.beginPath();
      ctx.arc(90+rand(-30,30)+i*45, 150+rand(-40,40), 18+12*s, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  // ===== Shapes per photo =====
  function stableIndexShape(i){
    const opts = ['rounded','circle','heart','triangle','hex','ticket'];
    return opts[i % opts.length];
  }

  function makeClipPath(x,y,w,h, shape, r){
    const cx = x + w/2, cy = y + h/2;
    const m = Math.min(w,h);

    ctx.beginPath();

    if(shape === 'rect'){
      ctx.rect(x,y,w,h);
      return;
    }
    if(shape === 'rounded' || shape === 'ticket'){
      roundedRect(x,y,w,h,r);
      return;
    }
    if(shape === 'circle'){
      const rad = (m/2) * 0.98;
      ctx.arc(cx, cy, rad, 0, Math.PI*2);
      return;
    }
    if(shape === 'triangle'){
      const pad = m*0.06;
      const topY = y + pad;
      const leftX = x + pad;
      const rightX = x + w - pad;
      const bottomY = y + h - pad;

      ctx.moveTo(cx, topY);
      ctx.lineTo(rightX, bottomY);
      ctx.lineTo(leftX, bottomY);
      ctx.closePath();
      return;
    }
    if(shape === 'hex'){
      const rad = (m/2) * 0.98;
      for(let i=0;i<6;i++){
        const a = (Math.PI/3)*i - Math.PI/6;
        const px = cx + Math.cos(a)*rad;
        const py = cy + Math.sin(a)*rad;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      return;
    }
    if(shape === 'heart'){
      const size = (m/2) * 1.05;
      drawHeartPath(cx, cy - size*0.08, size);
      return;
    }

    roundedRect(x,y,w,h,r);
  }

  function punchTicketNotches(x,y,w,h){
    const m=Math.min(w,h);
    const notch = m*0.12;
    const cy = y + h/2;

    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, cy, notch, -Math.PI/2, Math.PI/2, false);
    ctx.arc(x+w, cy, notch, Math.PI/2, -Math.PI/2, false);
    ctx.fill();
    ctx.restore();
  }

  function drawShot(im, x,y,w,h, r=18, idx=0){
    const base = shapeSel.value;
    const shape = (base === 'mix') ? stableIndexShape(idx) : base;

    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.25)';
    ctx.shadowBlur=20;
    ctx.shadowOffsetY=12;

    makeClipPath(x,y,w,h, shape, r);
    ctx.clip();
    ctx.drawImage(im,x,y,w,h);

    if(shape === 'ticket'){
      punchTicketNotches(x,y,w,h);
    }

    ctx.restore();

    ctx.save();
    ctx.strokeStyle='rgba(0,0,0,.10)';
    ctx.lineWidth=3;
    makeClipPath(x,y,w,h, shape, r);
    ctx.stroke();
    ctx.restore();
  }

  async function loadImages(dataUrls){
    return Promise.all(dataUrls.map(src=>{
      const im=new Image();
      im.src=src;
      return im.decode().then(()=>im);
    }));
  }

  function computeGrid(n){
    let cols=Math.ceil(Math.sqrt(n));
    let rows=Math.ceil(n/cols);
    if(rows>cols){ cols+=1; rows=Math.ceil(n/cols); }
    return {cols,rows};
  }

  // ===== layouts =====
  async function buildStrip(frames){
    const ims=await loadImages(frames);
    const gap=parseInt(gapRange.value,10);
    const pad=36;
    const labelH = ((captionEl.value||'').trim() || dateOn) ? 88 : 26;

    const iw=860;
    const ih=Math.round(iw/(3/4));
    const w=pad*2+iw;
    const h=pad*2+ims.length*ih+(ims.length-1)*gap+labelH;

    c.width=w; c.height=h;
    drawBackground(w,h);

    let y=pad, i=0;
    for(const im of ims){
      drawShot(im, pad, y, iw, ih, 20, i);
      y += ih + gap;
      i++;
    }

    themeOverlay(w,h);
    drawOuterBorder(w,h);
    drawCaption(w,h);
    return c.toDataURL('image/jpeg',0.95);
  }

  async function buildGrid(frames){
    const ims=await loadImages(frames);
    const n=ims.length;
    const {cols,rows}=computeGrid(n);
    const gap=parseInt(gapRange.value,10);
    const pad=36;
    const labelH = ((captionEl.value||'').trim() || dateOn) ? 88 : 26;

    const cellW = (cols<=2)? 860 : (cols===3? 620 : 500);
    const cellH = Math.round(cellW/(3/4));

    const w = pad*2 + cols*cellW + (cols-1)*gap;
    const h = pad*2 + rows*cellH + (rows-1)*gap + labelH;

    c.width=w; c.height=h;
    drawBackground(w,h);

    let idx=0;
    for(let r=0;r<rows;r++){
      for(let cc=0;cc<cols;cc++){
        if(idx>=n) break;
        const x=pad + cc*(cellW+gap);
        const y=pad + r*(cellH+gap);
        drawShot(ims[idx], x,y,cellW,cellH,18, idx);
        idx++;
      }
    }

    themeOverlay(w,h);
    drawOuterBorder(w,h);
    drawCaption(w,h);
    return c.toDataURL('image/jpeg',0.95);
  }

  async function buildPolaroid(frames){
    const ims=await loadImages([frames[frames.length-1]]);
    const im=ims[0];

    const pad=44;
    const labelH = ((captionEl.value||'').trim() || dateOn) ? 88 : 26;

    const photoW=820;
    const photoH=Math.round(photoW/(3/4));
    const framePad=28;
    const bottomExtra=120;

    const w = pad*2 + photoW + framePad*2;
    const h = pad*2 + photoH + framePad*2 + bottomExtra + labelH;

    c.width=w; c.height=h;
    drawBackground(w,h);

    const x=pad, y=pad;

    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.25)';
    ctx.shadowBlur=24;
    ctx.shadowOffsetY=14;
    ctx.fillStyle='#fff';
    roundedRect(x, y, w-2*pad, h-2*pad-labelH, 18);
    ctx.fill();
    ctx.restore();

    const px=x+framePad, py=y+framePad;
    drawShot(im, px,py,photoW,photoH,12, 0);

    themeOverlay(w,h);
    drawOuterBorder(w,h);

    const cap=(captionEl.value||'').trim();
    const parts=[];
    if(cap) parts.push(cap);
    if(dateOn) parts.push(new Date().toLocaleDateString('de-DE'));
    if(parts.length){
      const { ink } = themePalette();
      ctx.save();
      ctx.fillStyle = hexToRgba(ink, 0.88);
      ctx.font='900 34px system-ui, -apple-system, Segoe UI, Roboto, Arial';
      ctx.textAlign='center';
      ctx.fillText(parts.join(' • '), w/2, y + framePad + photoH + 70);
      ctx.restore();
    }

    return c.toDataURL('image/jpeg',0.95);
  }

  // ===== flipbook =====
  async function exportFlipbookWebM(frames){
    if(!frames || frames.length<2) throw new Error('Zu wenige Frames');

    const fps = parseInt(fpsRange.value,10);
    const ims = await loadImages(frames);

    const W = 720, H = 960;
    const oc = document.createElement('canvas');
    oc.width = W; oc.height = H;
    const octx = oc.getContext('2d');

    const stream = oc.captureStream(fps);
    const chunks = [];

    const opts = [
      { mimeType: 'video/webm;codecs=vp9' },
      { mimeType: 'video/webm;codecs=vp8' },
      { mimeType: 'video/webm' }
    ].find(o => MediaRecorder.isTypeSupported(o.mimeType)) || {};

    const rec = new MediaRecorder(stream, opts);
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };

    rec.start(100);

    const rounds = 2;
    const totalFrames = ims.length * rounds;

    for(let i=0;i<totalFrames;i++){
      const im = ims[i % ims.length];
      octx.clearRect(0,0,W,H);
      octx.drawImage(im, 0,0,W,H);
      await sleep(Math.round(1000 / fps));
    }

    rec.stop();
    await new Promise(r => rec.onstop = r);

    const blob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);

    const a=document.createElement('a');
    a.href=url;
    a.download=`flipbook_${themeSel.value}_${shapeSel.value}_${fps}fps.webm`;
    document.body.appendChild(a); a.click(); a.remove();

    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    return blob.size;
  }

  // ===== series =====
  async function takeSeries(){
    const n=parseInt(shotsRange.value,10);
    const t=parseInt(timerRange.value,10);

    setStatus(`Serie läuft…`);
    btnStart.disabled=true;

    const frames=[];
    for(let i=0;i<n;i++){
      if(t>0) await countdown(t);
      flash();
      frames.push(captureFrame());
      await sleep(250);
    }

    btnStart.disabled=false;
    setStatus(`Render…`);

    lastFrames = frames.slice();

    let out;
    if(layoutSel.value==='strip') out = await buildStrip(frames);
    else if(layoutSel.value==='polaroid') out = await buildPolaroid(frames);
    else out = await buildGrid(frames);

    lastOut=out;
    preview.src=out;
    setStatus(`Fertig.`);
  }

  btnStart.onclick=()=>takeSeries().catch(e=>{
    console.error(e);
    setStatus('Kamera nicht bereit.');
    btnStart.disabled=false;
  });

  btnFlipbook.onclick=async()=>{
    try{
      if(!lastFrames.length) { setStatus('Erst eine Serie aufnehmen.'); return; }
      setStatus('Flipbook…');
      const size = await exportFlipbookWebM(lastFrames);
      setStatus(`Fertig (${Math.round(size/1024)} KB).`);
    }catch(e){
      console.error(e);
      setStatus('Flipbook fehlgeschlagen.');
    }
  };

  (async()=>{
    try{
      await startCam();
      setStatus('Bereit.');
    }catch(e){
      console.error(e);
      setStatus('Kamera blockiert.');
    }
  })();

})();
</script>
